<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Restaurante Nossa Senhora Aparecida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }

    body{
      margin:0;
      padding:0;
      background:#0f172a;
      color:#e5e7eb;
    }

    /* ===== TOPO (SÓ IMAGEM) ===== */
    .header-image{
      width:100%;
      height:170px;                 /* 🔥 grande */
      overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,0.45);
      background: #0b1225;
    }
    .header-image img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;             /* cobre tudo sem deformar */
      object-position:center;       /* centraliza */
    }

    @media (max-width: 768px){
      .header-image{ height:120px; }
    }

    main{
      max-width:1100px;
      margin:20px auto;
      padding:10px;
    }

    .layout{
      display:grid;
      grid-template-columns: 2fr 1.5fr;
      gap:20px;
    }
    @media(max-width:900px){
      .layout{ grid-template-columns:1fr; }
    }

    .card{
      background:#fff;
      color:#333;
      border-radius:16px;
      padding:18px;
      box-shadow:0 6px 20px rgba(0,0,0,0.28);
      border:1px solid #d1d5db;
      margin-bottom:16px;
    }

    .card-title{
      font-size:18px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .cardapio-img img{
      width:100%;
      border-radius:14px;
      border:1px solid #ccc;
      display:block;
    }

    label{
      display:block;
      font-weight:bold;
      margin-top:10px;
      font-size:14px;
    }

    input, textarea{
      width:100%;
      padding:10px;
      margin-top:4px;
      border-radius:8px;
      border:1px solid #bbb;
      font-size:14px;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    .btn-primary{
      background:#b91c1c;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-whats{
      background:#22c55e;
      color:#fff;
      padding:10px 16px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      margin-left:10px;
      font-weight:bold;
    }

    .btn-whats:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    .payment-box{
      background:#f7f7f7;
      padding:15px;
      border-radius:12px;
      border:1px solid #ccc;
      margin-top:10px;
    }

    .payment-title{
      font-weight:bold;
      margin-bottom:6px;
    }

    .pay-option{
      background:#fff;
      border-radius:10px;
      border:1px solid #ccc;
      padding:12px;
      margin-top:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor:pointer;
    }

    .pay-option.selected{
      border-color:#b91c1c;
      background:#ffecec;
      box-shadow:0 0 0 2px #ffb3b3;
    }

    .flag-row{ display:flex; gap:6px; margin-top:4px; }
    .flag{
      padding:3px 8px;
      background:#fff;
      border:1px solid #aaa;
      border-radius:6px;
      font-size:12px;
    }

    pre{
      white-space:pre-wrap;
      font-size:14px;
      color:#333;
    }
  </style>
</head>

<body>

<header class="header-image">
  <!-- ✅ aqui usa o arquivo que existe no seu repo -->
  <img src="logo-nossa-senhora.jpg" alt="Restaurante Nossa Senhora Aparecida">
</header>

<main>
  <div class="layout">

    <div>
      <div class="card">
        <div class="cardapio-img">
          <img id="cardapioImg" src="cardapio-restaurante.jpg" alt="Cardápio do Dia">
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-title">Monte seu Pedido</div>

        <form id="formPedido">
          <label>Nome completo</label>
          <input id="nomeCliente" required>

          <label>Telefone / WhatsApp</label>
          <input id="telefoneCliente">

          <label>Pedido conforme cardápio</label>
          <textarea id="descricaoPedido" required></textarea>

          <div class="payment-box">
            <div class="payment-title">Forma de pagamento</div>

            <div class="pay-option" data-method="Cartões">
              <div>
                <b>Cartões</b>
                <div class="flag-row">
                  <div class="flag">Visa</div>
                  <div class="flag">MasterCard</div>
                  <div class="flag">Elo</div>
                </div>
              </div>
              <span>💳</span>
            </div>

            <div class="pay-option" data-method="Pix">
              <div><b>Pix</b><br><small>Chave: 545405380001</small></div>
              <span>🔁</span>
            </div>

            <div class="pay-option" data-method="Dinheiro">
              <div><b>Dinheiro</b><br><small>Troco na entrega</small></div>
              <span>💵</span>
            </div>

            <input type="hidden" id="pagamentoCliente">
          </div>

          <label>Endereço completo</label>
          <textarea id="enderecoCliente" required></textarea>

          <label>Observações</label>
          <textarea id="obsCliente"></textarea>

          <br>
          <button class="btn-primary" type="submit">Finalizar pedido</button>
          <button class="btn-whats" id="btnEnviarWhats" disabled>Enviar via WhatsApp</button>
        </form>
      </div>
    </div>

  </div>

  <div class="card">
    <div class="card-title">Resumo do Pedido</div>
    <pre id="resumo-pedido">Nenhum pedido montado ainda.</pre>
  </div>
</main>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzx3CT2Ow75Zb5JSQ8cy1toem9nFgHqxXHOK_6CbUuioZ5ar6zT1zzzyup_c02-uHs2/exec";
  const WHATSAPP_NUMBER = "5512987036362";

  async function carregarCardapio(){
    try{
      const r = await fetch(API_URL, { cache: "no-store" });
      const data = await r.json();
      if(data.ok && data.cardapio?.img){
        document.getElementById("cardapioImg").src = data.cardapio.img;
      }
    } catch(e){}
  }
  carregarCardapio();

  const payOptions = document.querySelectorAll(".pay-option");
  const pagamentoHidden = document.getElementById("pagamentoCliente");

  payOptions.forEach(opt=>{
    opt.onclick = ()=>{
      payOptions.forEach(o=>o.classList.remove("selected"));
      opt.classList.add("selected");
      pagamentoHidden.value = opt.dataset.method;
    };
  });

  let resumoFinal = "";

  formPedido.onsubmit = async e=>{
    e.preventDefault();

    const nome = nomeCliente.value.trim();
    const tel = telefoneCliente.value.trim();
    const pedido = descricaoPedido.value.trim();
    const pg = pagamentoCliente.value.trim();
    const end = enderecoCliente.value.trim();
    const obs = obsCliente.value.trim();

    if(!nome || !pedido || !pg || !end){
      alert("Preencha todos os campos obrigatórios.");
      return;
    }

    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "new_order",
        nome,
        telefone: tel,
        pedido,
        pagamento: pg,
        endereco: end,
        obs,
        origem: "site-clientes"
      }),
      headers: { "Content-Type": "text/plain;charset=utf-8" }
    });

    resumoFinal =
`📦 Novo pedido
👤 Nome: ${nome}
📞 Telefone: ${tel}
🍽 Pedido:
${pedido}

💳 Pagamento: ${pg}
🏠 Endereço:
${end}

📝 Obs:
${obs || "-"}`;

    document.getElementById("resumo-pedido").textContent = resumoFinal;
    btnEnviarWhats.disabled = false;
  };

  btnEnviarWhats.onclick = ()=>{
    window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(resumoFinal), "_blank");
  };
</script>

</body>
</html>
